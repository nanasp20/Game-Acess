<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Game Access</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="auth-body">
    
    <div class="auth-header">
        <a href="index.html" class="auth-logo">GAME ACCESS</a>
    </div>

    <div class="auth-container">
        <h2>Acesse sua conta</h2>
        <form action="home.html">
            <input type="email" placeholder="E-mail" required>
            <input type="password" placeholder="Senha" required>
            
            <button type="submit" class="btn-full">ENTRAR</button>
        </form>
        
        <p class="auth-footer">
            Novo por aqui? <a href="cadastro.html">Criar conta</a>.
        </p>
    </div>

    <footer class="site-footer">
        <div class="social-icons">
            <span class="material-icons">facebook</span>
            <span class="material-icons">photo_camera</span>
            <span class="material-icons">alternate_email</span>
        </div>
        <p class="copyright">© 2026 Game Access - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
