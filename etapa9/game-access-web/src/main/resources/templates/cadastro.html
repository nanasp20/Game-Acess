<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Game Access</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="auth-body">
    
    <div class="auth-header">
        <a href="/" class="auth-logo">GAME ACCESS</a>
    </div>

    <div class="auth-container">
        <h2>Crie sua conta</h2>
        
        <form th:action="@{/cadastrarUsuario}" method="post" autocomplete="off">
            
            <p th:if="${erroSenha}" style="color: #ff4444; background: rgba(255,68,68,0.1); padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 0.9rem;">
                <span class="material-icons" style="font-size: 1rem; vertical-align: middle;">error</span>
                <span th:text="${erroSenha}">Erro de senha</span>
            </p>

            <input type="text" name="nome" placeholder="Nome de Usuário (Ex: FefeGamer)" 
                   autocomplete="off" required>
            
            <input type="email" name="email" placeholder="E-mail" 
                   autocomplete="off" required>
            
            <input type="password" name="senha" placeholder="Senha" 
                   autocomplete="new-password" required>
            
            <input type="password" name="confirmarSenha" placeholder="Confirmar Senha" 
                   autocomplete="new-password" required>
            
            <button type="submit" class="btn-full">CADASTRAR</button>
        </form>
        
        <p class="auth-footer">
            Já tem uma conta? <a href="/login">Faça login</a>.
        </p>
    </div>

    <footer class="site-footer">
        <div class="social-icons">
            <span class="material-icons">facebook</span>
            <span class="material-icons">photo_camera</span>
            <span class="material-icons">alternate_email</span>
        </div>
        <p class="copyright">© 2026 Game Access - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
