<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Game Access</title>
    <link rel="stylesheet" href="/css/estilo.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .config-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 100px; /* Espaço para o header */
        }
        .config-section {
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .config-header {
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
            color: var(--verde-neon);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #aaa; margin-bottom: 8px; }
        .form-group input {
            width: 100%; padding: 12px;
            background: #000; border: 1px solid #444;
            color: white; border-radius: 5px; outline: none;
        }
        .form-group input:focus { border-color: var(--verde-neon); }
        
        /* ESTILOS NOVOS PARA FOTO DE PERFIL */
        .profile-edit { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .profile-pic-large { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid var(--verde-neon); }
        .url-input-group { flex-grow: 1; }

        .toggle-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; border-bottom: 1px solid #222;
        }
        .toggle-switch {
            position: relative; width: 50px; height: 26px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--verde-neon); }
        input:checked + .slider:before { transform: translateX(24px); }

        .btn-save {
            background: var(--verde-neon); color: black; border: none;
            padding: 15px 30px; font-weight: bold; border-radius: 8px;
            cursor: pointer; font-size: 1.1rem; width: 100%;
            margin-bottom: 50px;
        }
        .btn-save:hover { box-shadow: 0 0 15px rgba(0,255,65,0.4); }
    </style>
</head>
<body class="app-body">

    <header class="app-header">
        <div class="header-left">
            <div class="app-logo"><a href="/catalogo" style="text-decoration:none; color:var(--verde-neon)">GAME ACCESS</a></div>
        </div>
        <div class="header-right">
            <a href="/catalogo"><span class="material-icons" style="color:white; font-size: 2rem;">arrow_back</span></a>
            
            <img th:src="${usuario.fotoPerfil != null ? usuario.fotoPerfil : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" 
                 style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--verde-neon); margin-left: 10px;">
        </div>
    </header>

    <div class="main-content">
        <div class="config-container">
            
            <h1 style="color:white; margin-bottom:20px; font-family:'Bebas Neue'; font-size:3rem;">CONFIGURAÇÕES</h1>

            <form action="/salvarConfig" method="get">
                
                <div class="config-section">
                    <h2 class="config-header">MEU PERFIL</h2>
                    
                    <div class="profile-edit">
                        <img id="previewImg" th:src="${usuario.fotoPerfil != null ? usuario.fotoPerfil : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="profile-pic-large">
                        
                        <div class="url-input-group">
                            <label style="color:#aaa; display:block; margin-bottom:5px;">Link da Foto (URL)</label>
                            <input type="text" name="fotoPerfil" id="inputFoto" 
                                   th:value="${usuario.fotoPerfil}" 
                                   placeholder="Cole o link da imagem aqui..."
                                   onblur="atualizarPreview()">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Nome de Usuário</label>
                        <input type="text" name="nomeUsuario" th:value="${usuario.nomeUsuario}">
                    </div>
                    <div class="form-group">
                        <label>E-mail (Não editável)</label>
                        <input type="email" th:value="${usuario.email}" disabled style="opacity: 0.5;">
                    </div>
                </div>

                <div class="config-section">
                    <h2 class="config-header">PREFERÊNCIAS E SEGURANÇA</h2>
                    
                    <div class="toggle-row">
                        <span>Receber E-mails Promocionais</span>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="toggle-row">
                        <span>Controle Parental (Bloquear +18)</span>
                        <label class="toggle-switch">
                            <input type="checkbox" name="controleParental" th:checked="${usuario.controleParental}">
                            <span class="slider"></span>
                        </label>
                    </div>
                    
                    <div class="toggle-row">
                        <span>Exigir Senha para Compras</span>
                        <label class="toggle-switch">
                            <input type="checkbox" name="pedirSenhaCompra" th:checked="${usuario.pedirSenhaCompra}">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="config-section">
                    <h2 class="config-header">TROCAR SENHA</h2>
                    <div class="form-group">
                        <label>Nova Senha</label>
                        <input type="password" placeholder="Digite a nova senha">
                    </div>
                    <div class="form-group">
                        <label>Confirmar Senha</label>
                        <input type="password" placeholder="Confirme a nova senha">
                    </div>
                </div>

                <button type="submit" class="btn-save">SALVAR ALTERAÇÕES</button>
            </form>

        </div>
    </div>

    <footer class="site-footer">
        <p class="copyright">© 2026 Game Access</p>
    </footer>

    <script>
        function atualizarPreview() {
            var url = document.getElementById('inputFoto').value;
            if(url) {
                document.getElementById('previewImg').src = url;
            }
        }
    </script>

</body>
</html>
