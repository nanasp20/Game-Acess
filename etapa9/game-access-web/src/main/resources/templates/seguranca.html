<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Segurança - Game Access</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .config-container { max-width: 600px; margin: 0 auto; padding-top: 100px; }
        .card-security { background: #1a1a1a; padding: 30px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        .input-dark { width: 100%; padding: 15px; background: #000; border: 1px solid #444; color: white; border-radius: 5px; margin-top: 10px; font-size: 1.1rem; }
        .btn-save { background: var(--verde-neon); color: black; width: 100%; padding: 15px; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body class="app-body">
    
    <header class="app-header">
        <div class="header-left">
            <div class="app-logo"><a href="/catalogo" style="text-decoration:none; color:var(--verde-neon)">GAME ACCESS</a></div>
        </div>
        <div class="header-right" style="display: flex; align-items: center;">
            <div style="text-align: right; margin-right: 15px;">
                <span style="color:white; display:block; font-size: 0.9rem; font-weight: bold;" th:text="${usuario.nomeUsuario}">Usuário</span>
            </div>
            
            <a href="/configuracao" style="display: flex; align-items: center; text-decoration: none; margin-right: 10px;">
                <span class="material-icons" style="color:white; font-size: 2rem;">arrow_back</span>
            </a>

            <div style="display: flex; align-items: center;">
                <img th:src="${usuario.fotoPerfil != null ? usuario.fotoPerfil : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" 
                     style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--verde-neon);">
            </div>
        </div>
    </header>

    <div class="main-content">
        <div class="config-container">
            <h1 style="color: white; margin-bottom: 20px; font-family: 'Bebas Neue';">CENTRAL DE SEGURANÇA</h1>
            
            <p th:if="${param.sucesso}" style="color: var(--verde-neon); background: rgba(0,255,65,0.1); padding: 10px; border-radius: 5px; margin-bottom: 20px; text-align: center;">
                <span class="material-icons" style="vertical-align: middle;">check_circle</span> Senhas atualizadas com sucesso!
            </p>

            <form action="/salvarSeguranca" method="post">
                
                <div class="card-security">
                    <h3 style="color: var(--verde-neon);"><span class="material-icons" style="vertical-align:bottom;">lock</span> PIN Parental (4 Dígitos)</h3>
                    <p style="color: #aaa; font-size: 0.9rem;">Será solicitado para desbloquear jogos com classificação restrita.</p>
                    <input type="password" name="pinParental" class="input-dark" placeholder="****" maxlength="4" th:value="${usuario.pinParental}" required>
                </div>

                <div class="card-security">
                    <h3 style="color: var(--verde-neon);"><span class="material-icons" style="vertical-align:bottom;">shopping_cart</span> Senha de Compra</h3>
                    <p style="color: #aaa; font-size: 0.9rem;">Exigida antes de finalizar qualquer aluguel.</p>
                    <input type="password" name="senhaCompra" class="input-dark" placeholder="Digite sua senha de segurança" th:value="${usuario.senhaCompra}" required>
                </div>

                <button type="submit" class="btn-save">SALVAR SENHAS DE SEGURANÇA</button>
            </form>
        </div>
    </div>
</body>
</html>
